[package]
name = "apteronotus-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Device-free program binding and offline rendering to an audio file."

[[bin]]
name = "apteronotus-render"
path = "src/main.rs"

[dependencies]
apteronotus-live = { version = "0.1.0", path = "../live" }
apteronotus-lua = { version = "0.1.0", path = "../lua" }
apteronotus-pattern = { version = "0.1.0", path = "../pattern" }
apteronotus-songs = { version = "0.1.0", path = "../songs" }
apteronotus-synth = { version = "0.1.0", path = "../synth" }
fundsp = { version = "0.23.0", default-features = false, features = ["std"] }
hound = "3.5.1"
microfft = { version = "0.6.0", default-features = false, features = ["size-32768"] }
serde_json = "1.0"
