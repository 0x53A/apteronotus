[package]
name = "apteronotus-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "apteronotus"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd"]

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ["-O3", "--enable-simd"]

[dependencies]
apteronotus-live = { version = "0.1.0", path = "../live" }
apteronotus-lua = { version = "0.1.0", path = "../lua" }
apteronotus-pattern = { version = "0.1.0", path = "../pattern" }
apteronotus-render = { version = "0.1.0", path = "../render" }
apteronotus-songs = { version = "0.1.0", path = "../songs" }
apteronotus-synth = { version = "0.1.0", path = "../synth" }
fundsp = { version = "0.23.0", default-features = false, features = ["std"] }
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
midir = "0.11.0"
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
egui_web_component = { git = "https://github.com/0x53A/web-component-rs.git", rev = "dd67eb777ad7af07d7e86888dea2731c0afe048d" }
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "glow",
] }
js-sys = "0.3"
log = "0.4"
rust_web_component = { git = "https://github.com/0x53A/web-component-rs.git", rev = "dd67eb777ad7af07d7e86888dea2731c0afe048d" }
rust_web_component_macro = { git = "https://github.com/0x53A/web-component-rs.git", rev = "dd67eb777ad7af07d7e86888dea2731c0afe048d" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "HtmlElement",
    "Window", "Location", "Document", "Element", "Event", "EventTarget", "Node",
    "HtmlInputElement", "HtmlAnchorElement", "File", "FileList",
    "Blob", "BlobPropertyBag", "Url",
    "KeyboardEvent",
    "CustomEvent", "CustomEventInit",
    "Navigator", "MidiAccess", "MidiInputMap", "MidiInput", "MidiPort",
    "MidiPortDeviceState", "MidiOptions", "MidiMessageEvent",
] }
